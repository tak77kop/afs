version: '3.8'

services:
  afs-evaluator:
    build: .
    container_name: afs-evaluator
    ports:
      - "5001:5001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    env_file:
      - .env
    volumes:
      - afs-data:/home/ubuntu/afs/src/afs_database
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
               source /home/ubuntu/afs/install/setup.bash &&
               ros2 run afs_evaluator_app afs_evaluator_app"
    restart: unless-stopped

volumes:
  afs-data:
    name: afs-session-data
    external: true
